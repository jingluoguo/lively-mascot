interface:
  display_name: "Image to Lively Mascot Model"
  short_description: "Extract an image into a rigged SVG/HTML mascot"
  default_prompt: "Use $lively-mascot-image-model to extract the supplied image into a rigged Lively Mascot SVG model. Keep the body upright, use stable pupil clip wrappers, transform whole eye groups for expressions, animate emotion accessories such as tears and sweat locally, and make 3D visibly layered through independent nested SVG artwork planes without overriding the SDK camera layer."
