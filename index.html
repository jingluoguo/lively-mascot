<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lively-mascot · demo</title>
  <link rel="stylesheet" href="dist/lively-mascot.min.css" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, #f4fff1 0, transparent 45%),
        radial-gradient(circle at 85% 30%, #fff8e9 0, transparent 40%), #fdfdfb;
      color: #1d1d1f;
      min-height: 100vh;
    }

    .page {
      max-width: 860px;
      margin: 0 auto;
      padding: 56px 24px 88px;
    }

    .hero {
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 42px;
      letter-spacing: -1.5px;
    }

    .hero__dot {
      color: #48ff42;
      text-shadow: 2px 2px 0 #080808;
      -webkit-text-stroke: 1.5px #080808;
      font-size: 30px;
      vertical-align: 6px;
    }

    .hero__tagline {
      margin: 0 auto 14px;
      max-width: 580px;
      font-size: 16px;
      line-height: 1.7;
      color: #555;
    }

    .hero__hint {
      display: inline-block;
      margin: 0;
      padding: 6px 14px;
      border: 2px solid #080808;
      border-radius: 999px;
      background: #fff;
      box-shadow: 3px 3px 0 #080808;
      font-size: 13px;
      color: #333;
    }

    /* ---- Language Toggle (matches neo-brutalist theme) ---- */
    .lang-switch {
      position: absolute;
      top: 22px;
      right: 22px;
      display: inline-flex;
      gap: 0;
      padding: 3px;
      border: 2px solid #080808;
      border-radius: 999px;
      background: #fff;
      box-shadow: 3px 3px 0 #080808;
      cursor: pointer;
      user-select: none;
    }

    .lang-switch__btn {
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .5px;
      color: #666;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .lang-switch__btn.is-active {
      background: #080808;
      color: #fff;
    }

    /* ---- Stage: vertical stack ---- */
    .stage {
      max-width: 760px;
      margin: 32px auto 40px;
    }

    /* Showcase: mascot preview */
    .showcase {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 220px;
    }

    /* ---- Character Selector ---- */
    .char-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 36px;
    }

    .char-btn {
      width: 84px;
      padding: 9px 0;
      border: 2px solid #080808;
      border-radius: 12px;
      background: #fff;
      box-shadow: 3px 3px 0 #080808;
      font-size: 14px;
      font-weight: 700;
      color: #666;
      cursor: pointer;
      transition: all .15s;
    }

    .char-btn:hover {
      background: #f0f0f0;
      transform: translate(-1px, -1px);
    }

    .char-btn.is-active {
      background: #080808;
      color: #fff;
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 #080808;
    }

    /* ---- View mode segmented control ---- */
    .view-mode {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 22px;
      margin: 0;
      flex-wrap: wrap;
    }

    .view-mode__control {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .view-mode__label {
      font-size: 12px;
      font-weight: 800;
      color: #777;
      text-transform: uppercase;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .view-mode__group {
      display: inline-flex;
      padding: 3px;
      border: 2px solid #080808;
      border-radius: 999px;
      background: #fff;
      box-shadow: 3px 3px 0 #080808;
    }

    .view-mode__btn {
      min-width: 52px;
      padding: 5px 10px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #777;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .view-mode__btn:hover {
      background: #f0f0f0;
      color: #1d1d1f;
    }

    .view-mode__btn.is-active {
      background: #080808;
      color: #fff;
    }

    /* ---- Face variant picker (preview cards) ---- */
    .face-variants {
      flex-basis: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 2px;
    }

    .face-variants__label {
      font-size: 12px;
      font-weight: 800;
      color: #777;
      text-transform: uppercase;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .face-variants__grid {
      display: flex;
      gap: 10px;
    }

    .face-variant {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 72px;
      padding: 8px 6px 6px;
      border: 2px solid rgba(8, 8, 8, .12);
      border-radius: 10px;
      background: #fafafa;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, background .15s, transform .15s;
    }

    .face-variant:hover {
      border-color: rgba(8, 8, 8, .35);
    }

    .face-variant.is-active {
      border-color: #080808;
      background: #fff;
      box-shadow: 3px 3px 0 #080808;
      transform: translate(-1px, -1px);
    }

    .face-variant__preview {
      width: 44px;
      height: 44px;
      display: block;
      pointer-events: none;
    }

    .face-variant__name {
      font-size: 12px;
      font-weight: 800;
      color: #666;
    }

    .face-variant.is-active .face-variant__name {
      color: #080808;
    }

    /* ---- Main Tabs (below character switcher) ---- */
    .tabs {
      margin: 36px auto 0;
      max-width: 760px;
    }

    .tabs__bar {
      display: flex;
      gap: 0;
      border: 2px solid #080808;
      border-radius: 12px 12px 0 0;
      background: #fff;
      box-shadow: 3px 3px 0 #080808;
      overflow: hidden;
    }

    .tabs__btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      border-right: 1px solid #080808;
      background: #f5f5f5;
      font-size: 14px;
      font-weight: 700;
      color: #666;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .tabs__btn:last-child {
      border-right: none;
    }

    .tabs__btn:hover {
      background: #eee;
    }

    .tabs__btn.is-active {
      background: #fff;
      color: #1d1d1f;
    }

    .tabs__panel {
      display: none;
      border: 2px solid #080808;
      border-top: none;
      border-radius: 0 0 12px 12px;
      background: #fff;
      box-shadow: 3px 3px 0 #080808;
      padding: 20px;
    }

    .tabs__panel.is-active {
      display: block;
    }

    .tabs__panel.parameter-panel.is-active {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      min-height: 52px;
    }

    /* ---- Sub Tabs ---- */
    .sub-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .sub-tabs__btn {
      padding: 6px 14px;
      border: 2px solid #080808;
      border-radius: 999px;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      color: #666;
      cursor: pointer;
      transition: all .15s;
    }

    .sub-tabs__btn:hover {
      background: #f0f0f0;
    }

    .sub-tabs__btn.is-active {
      background: #080808;
      color: #fff;
    }

    .sub-panel {
      display: none;
    }

    .sub-panel.is-active {
      display: block;
    }

    /* ---- Palette Grid ---- */
    .palette {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .palette__item {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 72px;
      padding: 8px 6px;
      border-radius: 10px;
      border: 2px solid rgba(8, 8, 8, .12);
      background: #fafafa;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, background .15s, transform .15s;
    }

    .palette__swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, .15);
    }

    .palette__item:hover {
      border-color: rgba(8, 8, 8, .35);
    }

    .palette__item.is-active {
      border-color: #080808;
      background: #fff;
      box-shadow: 3px 3px 0 #080808;
      transform: translate(-1px, -1px);
    }

    .palette__item figcaption {
      font-size: 13px;
      color: #666;
      text-align: center;
      transition: color .15s, font-weight .15s;
    }

    .palette__item.is-active figcaption {
      color: #1d1d1f;
      font-weight: 900;
    }

    .theme-controls {
      display: grid;
      grid-template-columns: minmax(190px, .85fr) minmax(0, 1.15fr);
      gap: 14px;
      margin: 0 0 20px;
      padding-bottom: 18px;
      border-bottom: 2px dashed rgba(8, 8, 8, .15);
    }

    .model-default-theme {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 0;
      padding: 10px 12px;
      border: 2px solid #080808;
      border-radius: 10px;
      background: #fff;
      box-shadow: 3px 3px 0 #080808;
      cursor: pointer;
      text-align: left;
    }

    .model-default-theme:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #080808;
    }

    .model-default-theme:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 #080808;
    }

    .model-default-theme__copy {
      min-width: 0;
    }

    .model-default-theme__title {
      display: block;
      font-size: 12px;
      font-weight: 900;
      color: #1d1d1f;
    }

    .model-default-theme__hint {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      color: #777;
    }

    .model-default-theme__swatches {
      display: flex;
      flex: 0 0 auto;
      gap: 5px;
    }

    .model-default-theme__swatch {
      width: 24px;
      height: 24px;
      border: 2px solid #080808;
      border-radius: 50%;
      box-shadow: 1px 1px 0 rgba(0, 0, 0, .15);
    }

    /* ---- Emotion Grid (model on top, title below) ---- */
    .emotion-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .emotion-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 22px 6px 12px;
      border-radius: 8px;
      border: 2px solid rgba(8, 8, 8, .1);
      background: #fafafa;
      cursor: pointer;
      text-align: center;
      transition: all .1s;
    }

    .emotion-item:hover {
      background: #f0f0f0;
      transform: translateY(-2px);
      box-shadow: 2px 2px 0 rgba(0, 0, 0, .1);
    }

    .emotion-item:active {
      transform: scale(0.97) translateY(1px);
      box-shadow: 1px 1px 0 rgba(0, 0, 0, .15);
      background: #e8e8e8;
      transition: transform .06s, box-shadow .06s, background .06s;
    }

    .emotion-item.is-active {
      border-color: #080808;
      background: #fff;
      box-shadow: 3px 3px 0 #080808;
      transform: translate(-1px, -1px);
    }

    .emotion-item.is-active .emotion-item__name {
      color: #080808;
    }

    .emotion-item__model {
      width: 50px;
      height: 50px;
      margin: 0 auto;
      pointer-events: none;
    }

    .emotion-item__name {
      font-size: 13px;
      font-weight: 700;
      color: #1d1d1f;
    }

    .emotion-item__desc {
      font-size: 10px;
      line-height: 1.3;
      color: #888;
      margin-top: 1px;
    }

    /* ---- Custom emotion composer ---- */
    .emotion-composer {
      display: grid;
      gap: 16px;
      margin: 0 0 20px;
      padding: 2px 0 20px;
      border-bottom: 2px dashed rgba(8, 8, 8, .15);
    }

    .emotion-composer__title {
      margin: 0;
      font-size: 15px;
      font-weight: 900;
      color: #1d1d1f;
    }

    .emotion-composer__field--actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .emotion-composer__field {
      min-width: 0;
      padding: 10px;
      border: 2px solid rgba(8, 8, 8, .12);
      border-radius: 8px;
      background: #fafafa;
    }

    .emotion-composer__label {
      display: block;
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 800;
      color: #777;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .emotion-composer__options {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .emotion-composer__option {
      min-height: 30px;
      padding: 4px 9px;
      border: 2px solid rgba(8, 8, 8, .2);
      border-radius: 6px;
      background: #fafafa;
      color: #444;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
    }

    .emotion-composer__option:hover,
    .emotion-composer__option:focus-visible {
      border-color: #080808;
      outline: none;
    }

    .emotion-composer__option.is-active {
      border-color: #080808;
      background: #48ff42;
      color: #080808;
      box-shadow: 2px 2px 0 #080808;
      transform: translate(-1px, -1px);
    }

    .emotion-composer__apply {
      justify-self: start;
      height: 40px;
      padding: 0 14px;
      border: 2px solid #080808;
      border-radius: 6px;
      background: #080808;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .emotion-composer__apply:hover,
    .emotion-composer__apply:focus-visible {
      box-shadow: 3px 3px 0 #48ff42;
      outline: none;
      transform: translate(-1px, -1px);
    }

    .emotion-composer__field--blink {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-block: 8px;
    }

    .emotion-composer__field--blink .emotion-composer__label {
      display: inline;
      margin: 0;
      cursor: pointer;
    }

    /* ---- Footer: GitHub repo link (theme-matched) ---- */
    .footer {
      text-align: center;
      margin-top: 36px;
    }

    .footer__link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 2px solid #080808;
      border-radius: 999px;
      background: #fff;
      box-shadow: 3px 3px 0 #080808;
      font-size: 14px;
      font-weight: 700;
      color: #1d1d1f;
      text-decoration: none;
      transition: all .15s;
    }

    .footer__link:hover {
      background: #f0f0f0;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #080808;
    }

    .footer__link:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 #080808;
    }

    .footer__icon {
      color: #48ff42;
      text-shadow: 1px 1px 0 #080808;
      -webkit-text-stroke: 1px #080808;
      font-size: 16px;
    }

    /* ---- Custom color pickers (native <input type=color>) ---- */
    .color-custom {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      align-content: center;
    }

    .color-field {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .color-field__label {
      font-size: 12px;
      font-weight: 800;
      color: #777;
      text-transform: uppercase;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .color-field__picker {
      position: relative;
      display: inline-block;
      padding: 0;
      width: 46px;
      height: 34px;
      border: 2px solid #080808;
      border-radius: 8px;
      background: #fff;
      box-shadow: 3px 3px 0 #080808;
      cursor: pointer;
      overflow: hidden;
      transition: transform .15s, box-shadow .15s;
    }

    .color-field__picker:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #080808;
    }

    .color-field__picker:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 #080808;
    }

    .color-field__picker input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      position: absolute;
      top: -4px;
      left: -4px;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      border: none;
      padding: 0;
      background: none;
      cursor: pointer;
    }

    .color-field__picker input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-field__picker input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 0;
    }

    /* ---- Preset palette grid heading ---- */
    .panel-subtitle {
      display: block;
      margin: 4px 0 14px;
      font-size: 12px;
      font-weight: 800;
      color: #777;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    @media (max-width: 720px) {
      .view-mode {
        justify-content: center;
        gap: 12px;
      }

      .palette {
        grid-template-columns: repeat(3, 1fr);
      }

      .theme-controls {
        grid-template-columns: 1fr;
      }

      .emotion-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .emotion-composer__field--actions {
        grid-template-columns: 1fr;
      }

      .lang-switch {
        top: 14px;
        right: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="lang-switch" id="lang-switch">
      <button type="button" class="lang-switch__btn is-active" data-lang="zh">中文</button>
      <button type="button" class="lang-switch__btn" data-lang="en">EN</button>
    </div>

    <header class="hero">
      <h1><span class="hero__dot">✦</span> lively-mascot</h1>
      <p class="hero__tagline" id="tagline"></p>
      <p class="hero__hint" id="hint"></p>
    </header>

    <!-- Stage: vertical stack -->
    <div class="stage">
      <section class="showcase" id="showcase"></section>
      <div class="char-bar" id="char-bar"></div>
      <div class="tabs" id="tabs">
        <div class="tabs__bar" id="tabs-bar"></div>
        <div class="tabs__panel parameter-panel is-active" id="panel-parameters">
          <div class="view-mode" id="view-mode">
            <div class="view-mode__control">
              <span class="view-mode__label" id="view-mode-label"></span>
              <div class="view-mode__group" role="group" aria-labelledby="view-mode-label">
                <button type="button" class="view-mode__btn view-mode__mode-btn" data-mode="2d"
                  aria-pressed="false">2D</button>
                <button type="button" class="view-mode__btn view-mode__mode-btn is-active" data-mode="3d"
                  aria-pressed="true">3D</button>
              </div>
            </div>
            <div class="view-mode__control">
              <span class="view-mode__label" id="outline-label"></span>
              <div class="view-mode__group" role="group" aria-labelledby="outline-label">
                <button type="button" class="view-mode__btn view-mode__outline-btn is-active" data-outline="visible"
                  aria-pressed="true"></button>
                <button type="button" class="view-mode__btn view-mode__outline-btn" data-outline="hidden"
                  aria-pressed="false"></button>
              </div>
            </div>
          </div>
          <div class="face-variants" id="face-variants">
            <span class="face-variants__label" id="face-label">五官</span>
            <div class="face-variants__grid" role="group" aria-labelledby="face-label">
              <button type="button" class="face-variant is-active" data-face="default" aria-pressed="true">
                <svg class="face-variant__preview" viewBox="0 0 64 64" aria-hidden="true">
                  <ellipse cx="16" cy="41" rx="5" ry="3" fill="#ff9fb6" />
                  <ellipse cx="48" cy="41" rx="5" ry="3" fill="#ff9fb6" />
                  <ellipse cx="22" cy="28" rx="7" ry="8" fill="#fff" stroke="#080808" stroke-width="2.5" />
                  <circle cx="22" cy="29" r="4" fill="#080808" />
                  <circle cx="23.6" cy="27" r="1.4" fill="#fff" />
                  <ellipse cx="42" cy="28" rx="7" ry="8" fill="#fff" stroke="#080808" stroke-width="2.5" />
                  <circle cx="42" cy="29" r="4" fill="#080808" />
                  <circle cx="43.6" cy="27" r="1.4" fill="#fff" />
                  <path d="M26 40 Q32 46 38 40" fill="none" stroke="#080808" stroke-width="2.5"
                    stroke-linecap="round" />
                </svg>
                <span class="face-variant__name" data-face-name="default">默认</span>
              </button>
              <button type="button" class="face-variant" data-face="simple" aria-pressed="false">
                <svg class="face-variant__preview" viewBox="0 0 64 64" aria-hidden="true">
                  <rect x="18.5" y="17" width="7" height="22" rx="3.5" fill="#080808" />
                  <rect x="38.5" y="17" width="7" height="22" rx="3.5" fill="#080808" />
                </svg>
                <span class="face-variant__name" data-face-name="simple">简约</span>
              </button>
              <button type="button" class="face-variant" data-face="dot" aria-pressed="false">
                <svg class="face-variant__preview" viewBox="0 0 64 64" aria-hidden="true">
                  <circle cx="22" cy="28" r="5.5" fill="#080808" />
                  <circle cx="42" cy="28" r="5.5" fill="#080808" />
                </svg>
                <span class="face-variant__name" data-face-name="dot">圆点</span>
              </button>
            </div>
          </div>
        </div>
        <div class="tabs__panel" id="panel-color"></div>
        <div class="tabs__panel" id="panel-emotion"></div>
        <div class="tabs__panel" id="panel-composer"></div>
      </div>
    </div>

    <footer class="footer">
      <a class="footer__link" id="repo-link" href="https://github.com/jingluoguo/lively-mascot" target="_blank"
        rel="noopener">
        <span class="footer__icon">★</span><span id="repo-label"></span>
      </a>
    </footer>
  </main>

  <script src="dist/lively-mascot.min.js"></script>
  <script>
    // ============================================================
    // i18n dictionary
    // ============================================================
    var I18N = {
      zh: {
        tagline: '通用电子宠物引擎：多角色 · 纯 SVG 驱动 · 零依赖 · 即插即用。',
        hint: '把光标移到吉祥物上 · 点击让它开心',
        repoLabel: '在 GitHub 上查看源码',
        viewMode: '视图', outline: '边框', outlineOn: '显示', outlineOff: '隐藏',
        face: '五官', faceDefault: '默认', faceSimple: '简约', faceDot: '圆点',
        tabs: ['参数', '颜色', '表情', '动作编排'],
        colorFields: { body: '身体', outline: '描边', accent: '点缀' },
        presetTitle: '预设配色',
        palette: ['薄荷绿', '天空蓝', '蜜桃橙', '薰衣草紫', '玫瑰粉', '柠檬黄'],
        groupNames: {
          lifecycle: '生命周期', reaction: '情绪反应', work: '工作状态'
        },
        emotionComposer: {
          title: '动作编排', apply: '应用编排', customName: '自定义动作', blink: '快速眨眼'
        },
        sayGreeting: function (name, time) {
          return name + ' 说：你好！（点击于 ' + (time || new Date()).toLocaleTimeString() + '）';
        },
        sayEmotion: function (name) {
          return '表情：' + name;
        }
      },
      en: {
        tagline: 'Universal e-pet engine: multi-character · pure SVG · zero deps · drop-in.',
        hint: 'Hover the mascot · click to make it happy',
        repoLabel: 'View source on GitHub',
        viewMode: 'View', outline: 'Outline', outlineOn: 'On', outlineOff: 'Off',
        face: 'Face', faceDefault: 'Default', faceSimple: 'Simple', faceDot: 'Dot',
        tabs: ['Parameters', 'Color', 'Emotion', 'Actions'],
        colorFields: { body: 'Body', outline: 'Outline', accent: 'Accent' },
        presetTitle: 'Presets',
        palette: ['Mint', 'Sky Blue', 'Peach', 'Lavender', 'Rose', 'Lemon'],
        groupNames: {
          lifecycle: 'Lifecycle', reaction: 'Reactions', work: 'Work states'
        },
        emotionComposer: {
          title: 'Action composer', apply: 'Apply actions', customName: 'Custom action', blink: 'Fast blink'
        },
        sayGreeting: function (name, time) {
          return name + ' says: hello! (clicked at ' + (time || new Date()).toLocaleTimeString() + ')';
        },
        sayEmotion: function (name) {
          return 'Emotion: ' + name;
        }
      }
    };
    var currentLang = 'zh';
    function T() { return I18N[currentLang]; }
    document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';

    // ---- Hint helper ----
    var hint = document.getElementById('hint');
    var lastMessage = null; // { build: function() {...} } so it re-renders on language switch
    function say(build) { lastMessage = build; hint.textContent = build(); }

    // ---- Current mascot instance ----
    var hero = null;
    var currentCharType;
    var currentViewMode = '3d';
    var outlineVisible = true;
    var currentFaceVariant = 'default';
    var currentTheme = null;
    var currentEmotionId = '02';
    var previewInstances = []; // static thumbnails in the emotion gallery

    function getPresentation(type) {
      var model = LivelyMascot.models[type] || {};
      return model.presentation || { labels: {}, greeting: {}, theme: {}, order: 1000, icon: '' };
    }

    function getModelLabel(type) {
      var model = LivelyMascot.models[type] || {};
      var presentation = getPresentation(type);
      return (presentation.labels && presentation.labels[currentLang]) || model.name || type;
    }

    function getModelGreeting(type) {
      var presentation = getPresentation(type);
      return (presentation.greeting && presentation.greeting[currentLang]) || getModelLabel(type);
    }

    function getDefaultTheme(type) {
      return Object.assign({}, getPresentation(type).theme || {});
    }

    function applyModelTheme(instance, type) {
      var theme = currentTheme || getDefaultTheme(type);
      if (theme.body || theme.outline || theme.accent) instance.setTheme(theme);
    }

    function createHero(type) {
      if (hero) hero.destroy();
      var container = document.getElementById('showcase');
      container.innerHTML = '';
      hero = LivelyMascot.createMascot(container, {
        type: type,
        size: 180,
        viewMode: currentViewMode,
        outlineVisible: outlineVisible,
        hopInterval: [3, 6],
        onClick: function () { say(function () { return T().sayGreeting(getModelGreeting(type), new Date()); }); },
      });
      hero.setFaceVariant(currentFaceVariant);
      currentCharType = type;
      applyModelTheme(hero, type);
      if (typeof syncColorInputs === 'function') syncColorInputs();
      if (LivelyMascot.emotions[currentEmotionId]) hero.setEmotion(currentEmotionId);
    }

    // ---- Character Bar ----
    var charBar = document.getElementById('char-bar');
    var charTypes = Object.keys(LivelyMascot.models).sort(function (a, b) {
      var orderA = getPresentation(a).order;
      var orderB = getPresentation(b).order;
      return orderA - orderB || a.localeCompare(b);
    });
    currentCharType = LivelyMascot.models.sprout ? 'sprout' : charTypes[0];
    var charBtns = [];

    charTypes.forEach(function (type) {
      var btn = document.createElement('button');
      btn.className = 'char-btn' + (type === currentCharType ? ' is-active' : '');
      btn.dataset.type = type;
      btn.addEventListener('click', function () {
        charBtns.forEach(function (b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        currentEmotionId = '02';
        createHero(type);
        renderActionFields();
        renderEmotionPreviews();
      });
      charBar.appendChild(btn);
      charBtns.push(btn);
    });

    // ---- 2D / 3D view mode ----
    var viewModeBtns = Array.prototype.slice.call(document.querySelectorAll('.view-mode__mode-btn'));
    viewModeBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentViewMode = btn.dataset.mode;
        viewModeBtns.forEach(function (b) {
          var active = b.dataset.mode === currentViewMode;
          b.classList.toggle('is-active', active);
          b.setAttribute('aria-pressed', String(active));
        });
        if (hero) hero.setViewMode(currentViewMode);
        previewInstances.forEach(function (pInst) { pInst.setViewMode(currentViewMode); });
      });
    });

    // ---- Outer outline toggle ----
    var outlineBtns = Array.prototype.slice.call(document.querySelectorAll('.view-mode__outline-btn'));
    function syncOutlineToggle() {
      outlineBtns.forEach(function (btn) {
        var active = (btn.dataset.outline === 'visible') === outlineVisible;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-pressed', String(active));
        btn.textContent = btn.dataset.outline === 'visible' ? T().outlineOn : T().outlineOff;
      });
    }
    outlineBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        outlineVisible = btn.dataset.outline === 'visible';
        syncOutlineToggle();
        if (hero) hero.setOutlineVisible(outlineVisible);
        previewInstances.forEach(function (pInst) { pInst.setOutlineVisible(outlineVisible); });
      });
    });

    // ---- Face variant toggle ----
    var faceBtns = Array.prototype.slice.call(document.querySelectorAll('.face-variant'));
    function syncFaceVariant() {
      faceBtns.forEach(function (btn) {
        var active = btn.dataset.face === currentFaceVariant;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-pressed', String(active));
        var t = T();
        var nameEl = btn.querySelector('.face-variant__name');
        if (nameEl) {
          if (btn.dataset.face === 'default') nameEl.textContent = t.faceDefault;
          else if (btn.dataset.face === 'simple') nameEl.textContent = t.faceSimple;
          else if (btn.dataset.face === 'dot') nameEl.textContent = t.faceDot;
        }
      });
    }
    faceBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentFaceVariant = btn.dataset.face;
        syncFaceVariant();
        if (hero) hero.setFaceVariant(currentFaceVariant);
        previewInstances.forEach(function (pInst) { pInst.setFaceVariant(currentFaceVariant); });
      });
    });

    // ---- Main Tabs ----
    var tabsBar = document.getElementById('tabs-bar');
    var panels = document.querySelectorAll('.tabs__panel');
    var tabBtns = [];

    for (var i = 0; i < T().tabs.length; i++) {
      (function (i) {
        var btn = document.createElement('button');
        btn.className = 'tabs__btn' + (i === 0 ? ' is-active' : '');
        btn.addEventListener('click', function () {
          tabBtns.forEach(function (b) { b.classList.remove('is-active'); });
          btn.classList.add('is-active');
          panels.forEach(function (p) { p.classList.remove('is-active'); });
          panels[i].classList.add('is-active');
          // Re-render thumbnails when the (initially hidden) emotion panel
          // becomes visible, so container-relative headwear sizes settle.
          if (i === 2) renderEmotionPreviews();
        });
        tabsBar.appendChild(btn);
        tabBtns.push(btn);
      })(i);
    }

    // ---- Color Panel ----
    var palettes = [
      { name: '薄荷绿', en: 'Mint', color: '#48ff42', outline: '#080808', accent: '#ff9fb6' },
      { name: '天空蓝', en: 'Sky Blue', color: '#6ec7ff', outline: '#0b1e3a' },
      { name: '蜜桃橙', en: 'Peach', color: '#ffb37a', outline: '#5c2a12' },
      { name: '薰衣草紫', en: 'Lavender', color: '#c9a6ff', outline: '#2e1a4d' },
      { name: '玫瑰粉', en: 'Rose', color: '#ff9fb6', outline: '#5c1f33' },
      { name: '柠檬黄', en: 'Lemon', color: '#ffe066', outline: '#4d3d00' },
      { name: '炭灰', en: 'Charcoal', color: '#3d4852', outline: '#131a20', accent: '#eeb3c1' },
      { name: '奶油白', en: 'Cream', color: '#f1e7d8', outline: '#463a2e' },
      { name: '钢蓝', en: 'Steel Blue', color: '#6f879b', outline: '#162332', accent: '#74e5ff' },
      { name: '浅青', en: 'Pale Cyan', color: '#bdeef2', outline: '#23434d', accent: '#a9d9ff' },
      { name: '莓果粉', en: 'Berry Pink', color: '#f29cc2', outline: '#5a243e', accent: '#ffe0a8' },
    ];
    var palettePanel = document.getElementById('panel-color');
    var paletteGrid = document.createElement('div');
    paletteGrid.className = 'palette';
    var paletteCaptions = [];
    var activeSwatch = null;
    var colorInputs = {};
    var themeControls = document.createElement('div');
    themeControls.className = 'theme-controls';

    var defaultThemeButton = document.createElement('button');
    defaultThemeButton.type = 'button';
    defaultThemeButton.className = 'model-default-theme';
    defaultThemeButton.setAttribute('aria-label', 'Restore model default colors');
    var defaultThemeCopy = document.createElement('span');
    defaultThemeCopy.className = 'model-default-theme__copy';
    var defaultThemeTitle = document.createElement('span');
    defaultThemeTitle.className = 'model-default-theme__title';
    var defaultThemeHint = document.createElement('span');
    defaultThemeHint.className = 'model-default-theme__hint';
    defaultThemeCopy.appendChild(defaultThemeTitle);
    defaultThemeCopy.appendChild(defaultThemeHint);
    var defaultThemeSwatches = document.createElement('span');
    defaultThemeSwatches.className = 'model-default-theme__swatches';
    var defaultThemeSwatchEls = {};
    ['body', 'outline', 'accent'].forEach(function (key) {
      var swatch = document.createElement('span');
      swatch.className = 'model-default-theme__swatch';
      swatch.dataset.themeKey = key;
      swatch.title = key;
      defaultThemeSwatches.appendChild(swatch);
      defaultThemeSwatchEls[key] = swatch;
    });
    defaultThemeButton.appendChild(defaultThemeCopy);
    defaultThemeButton.appendChild(defaultThemeSwatches);
    defaultThemeButton.addEventListener('click', function () {
      currentTheme = getDefaultTheme(currentCharType);
      applyThemeToAll();
      syncColorInputs();
      if (activeSwatch) { activeSwatch.classList.remove('is-active'); activeSwatch = null; }
    });
    function syncDefaultThemeCard() {
      var theme = getDefaultTheme(currentCharType);
      var label = getModelLabel(currentCharType);
      defaultThemeTitle.textContent = currentLang === 'zh' ? label + '默认色' : label + ' default';
      defaultThemeHint.textContent = currentLang === 'zh' ? '点击恢复该模型配色' : 'Click to restore model colors';
      ['body', 'outline', 'accent'].forEach(function (key) {
        defaultThemeSwatchEls[key].style.background = theme[key] || '#fff';
      });
    }

    // ---- Custom color pickers (native <input type=color>) ----
    var presetTitle = document.createElement('span');
    presetTitle.className = 'panel-subtitle';

    var colorCustom = document.createElement('div');
    colorCustom.className = 'color-custom';
    var colorKeys = ['body', 'outline', 'accent'];
    colorKeys.forEach(function (key) {
      var field = document.createElement('label');
      field.className = 'color-field';
      var label = document.createElement('span');
      label.className = 'color-field__label';
      label.dataset.colorKey = key;
      var picker = document.createElement('span');
      picker.className = 'color-field__picker';
      var input = document.createElement('input');
      input.type = 'color';
      input.dataset.key = key;
      input.addEventListener('input', function () {
        if (!currentTheme) currentTheme = getDefaultTheme(currentCharType);
        currentTheme[key] = input.value;
        applyThemeToAll();
        if (activeSwatch) { activeSwatch.classList.remove('is-active'); activeSwatch = null; }
      });
      picker.appendChild(input);
      field.appendChild(label);
      field.appendChild(picker);
      colorCustom.appendChild(field);
      colorInputs[key] = input;
    });
    themeControls.appendChild(defaultThemeButton);
    themeControls.appendChild(colorCustom);
    palettePanel.appendChild(themeControls);
    palettePanel.appendChild(presetTitle);

    // keep the three pickers in sync with whatever theme is currently applied
    function syncColorInputs() {
      var t = currentTheme || getDefaultTheme(currentCharType);
      if (/^#[0-9a-f]{6}$/i.test(t.body)) colorInputs.body.value = t.body;
      if (/^#[0-9a-f]{6}$/i.test(t.outline)) colorInputs.outline.value = t.outline;
      if (/^#[0-9a-f]{6}$/i.test(t.accent)) colorInputs.accent.value = t.accent;
      syncDefaultThemeCard();
    }

    function applyThemeToAll() {
      hero.setTheme(currentTheme);
      previewInstances.forEach(function (pInst) { pInst.setTheme(currentTheme); });
    }

    palettes.forEach(function (p) {
      var fig = document.createElement('figure');
      fig.className = 'palette__item';
      var swatch = document.createElement('span');
      swatch.className = 'palette__swatch';
      swatch.style.background = p.color;
      swatch.style.border = '2px solid ' + p.outline;
      var caption = document.createElement('figcaption');
      fig.appendChild(swatch);
      fig.appendChild(caption);
      fig.addEventListener('click', function () {
        currentTheme = {
          body: p.color,
          outline: p.outline,
          accent: p.accent || (currentTheme && currentTheme.accent) || getDefaultTheme(currentCharType).accent
        };
        applyThemeToAll();
        syncColorInputs();
        if (activeSwatch) activeSwatch.classList.remove('is-active');
        fig.classList.add('is-active');
        activeSwatch = fig;
      });
      paletteGrid.appendChild(fig);
      paletteCaptions.push(caption);
    });
    palettePanel.appendChild(paletteGrid);

    // ---- Emotion Panel (Sub Tabs) ----
    var emotionPanel = document.getElementById('panel-emotion');
    var composerPanel = document.getElementById('panel-composer');
    var groups = LivelyMascot.emotionGroups;
    var emotions = LivelyMascot.emotions;
    var groupKeys = Object.keys(groups);
    var groupOrder = groupKeys.slice().sort(function (a, b) {
      return groups[a].order - groups[b].order;
    });

    var subBar = document.createElement('div');
    subBar.className = 'sub-tabs';
    var subBtns = [];
    var subPanels = [];
    var subCaptions = [];

    var composer = document.createElement('section');
    composer.className = 'emotion-composer';
    var composerTitle = document.createElement('h2');
    composerTitle.className = 'emotion-composer__title';
    composer.appendChild(composerTitle);

    var actionFields = document.createElement('div');
    actionFields.className = 'emotion-composer__field emotion-composer__field--actions';
    var selectedActions = {};
    var actionFieldsByPart = {};
    function getPartLabel(part) {
      var labels = {
        body: { zh: '身体动作', en: 'Body motion' },
        eyes: { zh: '眼睛状态', en: 'Eye state' },
        mouth: { zh: '嘴巴状态', en: 'Mouth state' },
        top: { zh: '顶部装饰', en: 'Top detail' },
        feet: { zh: '脚步动作', en: 'Feet motion' },
        tail: { zh: '尾巴动作', en: 'Tail motion' },
        accessory: { zh: '配件状态', en: 'Accessory' }
      };
      return (labels[part] && labels[part][currentLang]) || part;
    }
    function renderActionFields() {
      actionFields.textContent = '';
      selectedActions = {};
      actionFieldsByPart = {};
      var model = LivelyMascot.models[currentCharType];
      Object.keys(model.parts || {}).forEach(function (part) {
        var actions = model.parts[part].actions || [];
        if (!actions.length || part === 'pupils' || part === 'face') return;
        var field = document.createElement('div');
        field.className = 'emotion-composer__field';
        var label = document.createElement('div');
        label.className = 'emotion-composer__label';
        label.textContent = getPartLabel(part);
        var options = document.createElement('div');
        options.className = 'emotion-composer__options';
        options.setAttribute('role', 'group');
        options.setAttribute('aria-label', getPartLabel(part));
        actions.forEach(function (action) {
          var option = document.createElement('button');
          option.type = 'button';
          option.className = 'emotion-composer__option';
          option.textContent = action;
          option.setAttribute('aria-pressed', 'false');
          option.addEventListener('click', function () {
            var isSelected = selectedActions[part] === action;
            if (isSelected) delete selectedActions[part];
            else selectedActions[part] = action;
            Array.prototype.forEach.call(options.children, function (button) {
              var active = !isSelected && button === option;
              button.classList.toggle('is-active', active);
              button.setAttribute('aria-pressed', String(active));
            });
          });
          options.appendChild(option);
        });
        field.appendChild(label);
        field.appendChild(options);
        actionFields.appendChild(field);
        actionFieldsByPart[part] = options;
      });
      var blinkField = document.createElement('label');
      blinkField.className = 'emotion-composer__field emotion-composer__field--blink';
      var blinkLabel = document.createElement('span');
      blinkLabel.className = 'emotion-composer__label';
      var blink = document.createElement('input');
      blink.type = 'checkbox';
      blink.className = 'emotion-composer__blink';
      blinkLabel.appendChild(blink);
      blinkLabel.appendChild(document.createTextNode(' ' + T().emotionComposer.blink));
      blinkField.appendChild(blinkLabel);
      actionFields.appendChild(blinkField);
      actionFieldsByPart.__blink = blink;
    }
    renderActionFields();
    composer.appendChild(actionFields);

    var applyCustomEmotion = document.createElement('button');
    applyCustomEmotion.type = 'button';
    applyCustomEmotion.className = 'emotion-composer__apply';
    applyCustomEmotion.addEventListener('click', function () {
      var behaviors = Object.keys(selectedActions).filter(function (key) { return key !== '__blink'; }).map(function (part) { return part + '-' + selectedActions[part]; });
      if (!behaviors.length) behaviors = ['idle'];
      var custom = {
        recipe: { parts: Object.assign({}, selectedActions) },
        blink: actionFieldsByPart.__blink.checked ? 'fast' : true
      };
      delete custom.recipe.parts.__blink;
      custom.id = 'demo-custom-mix';
      custom.name = T().emotionComposer.customName;
      custom.group = 'custom';
      custom.desc = behaviors.join(' + ');
      custom.behaviors = behaviors;
      LivelyMascot.defineEmotion(custom);
      currentEmotionId = custom.id;
      hero.setEmotion(custom.id);
      emotionPanel.querySelectorAll('.emotion-item.is-active').forEach(function (item) { item.classList.remove('is-active'); });
      say(function () { return T().sayEmotion(T().emotionComposer.customName + ' · ' + behaviors.join(' + ')); });
    });
    composer.appendChild(applyCustomEmotion);

    groupOrder.forEach(function (key, i) {
      var btn = document.createElement('button');
      btn.className = 'sub-tabs__btn' + (i === 0 ? ' is-active' : '');
      btn.addEventListener('click', function () {
        subBtns.forEach(function (b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        subPanels.forEach(function (p) { p.classList.remove('is-active'); });
        subPanels[i].classList.add('is-active');
      });
      subBar.appendChild(btn);
      subBtns.push(btn);

      var panel = document.createElement('div');
      panel.className = 'sub-panel' + (i === 0 ? ' is-active' : '');
      var grid = document.createElement('div');
      grid.className = 'emotion-grid';

      Object.values(emotions).filter(function (e) { return e.group === key; }).forEach(function (e) {
        var item = document.createElement('div');
        item.className = 'emotion-item';
        if (e.id === '02') item.classList.add('is-active');
        item.dataset.emotionId = e.id;
        var modelBox = document.createElement('div');
        modelBox.className = 'emotion-item__model';
        var nameEl = document.createElement('div');
        nameEl.className = 'emotion-item__name';
        var descEl = document.createElement('div');
        descEl.className = 'emotion-item__desc';
        item.appendChild(modelBox);
        item.appendChild(nameEl);
        item.appendChild(descEl);
        item.addEventListener('click', function () {
          currentEmotionId = e.id;
          hero.setEmotion(e.id);
          emotionPanel.querySelectorAll('.emotion-item.is-active').forEach(function (a) { a.classList.remove('is-active'); });
          item.classList.add('is-active');
          say(function () { return T().sayEmotion(getEmotionLabel(e)); });
        });
        grid.appendChild(item);
      });

      panel.appendChild(grid);
      subPanels.push(panel);
    });

    composerPanel.appendChild(composer);
    emotionPanel.appendChild(subBar);
    subPanels.forEach(function (p) { emotionPanel.appendChild(p); });

    // ---- Emotion gallery thumbnails (model on top, title below) ----
    // Each card shows a small STATIC mascot (current character + theme) posing
    // the emotion, with the emotion name as its caption. No cursor-follow,
    // no idle animation — these are just previews.
    function renderEmotionPreviews() {
      previewInstances.forEach(function (p) { p.destroy(); });
      previewInstances = [];
      document.querySelectorAll('.emotion-item__model').forEach(function (box) {
        var item = box.closest('.emotion-item');
        var inst = LivelyMascot.createMascot(box, {
          type: currentCharType,
          size: 50,
          animated: false,
          followCursor: false,
          viewMode: currentViewMode,
          outlineVisible: outlineVisible
        });
        inst.setFaceVariant(currentFaceVariant);
        inst.setEmotion(item.dataset.emotionId);
        applyModelTheme(inst, currentCharType);
        previewInstances.push(inst);
      });
    }
    renderEmotionPreviews();

    // ---- Apply / refresh all text for the current language ----
    function applyLanguage() {
      var t = T();
      document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
      document.getElementById('tagline').textContent = t.tagline;
      document.getElementById('repo-label').textContent = t.repoLabel;
      document.getElementById('view-mode-label').textContent = t.viewMode;
      document.getElementById('outline-label').textContent = t.outline;
      document.getElementById('face-label').textContent = t.face;
      syncOutlineToggle();
      syncFaceVariant();
      toggleButtons.forEach(function (b) {
        b.classList.toggle('is-active', b.dataset.lang === currentLang);
      });

      // Hero hint: re-render a shown dynamic message in the new language,
      // otherwise fall back to the default hint
      if (lastMessage) {
        hint.textContent = lastMessage();
      } else {
        hint.textContent = t.hint;
      }

      // Character bar
      charBtns.forEach(function (btn) {
        var presentation = getPresentation(btn.dataset.type);
        btn.textContent = (presentation.icon ? presentation.icon + ' ' : '') + getModelLabel(btn.dataset.type);
      });

      // Main tabs
      tabBtns.forEach(function (btn, i) { btn.textContent = t.tabs[i]; });

      // Palette captions
      paletteCaptions.forEach(function (cap, i) {
        cap.textContent = currentLang === 'zh' ? palettes[i].name : palettes[i].en;
      });

      // Custom picker labels + preset subtitle
      if (presetTitle) presetTitle.textContent = t.presetTitle;
      syncDefaultThemeCard();
      defaultThemeButton.setAttribute('aria-label', currentLang === 'zh' ? '恢复模型默认配色' : 'Restore model default colors');
      document.querySelectorAll('.color-field__label').forEach(function (lab) {
        lab.textContent = t.colorFields[lab.dataset.colorKey];
      });

      // Emotion sub-tab captions
      subCaptions.forEach(function (cap, i) {
        var key = groupOrder[i];
        cap.textContent = (t.groupNames[key] || groups[key].name || key) + ' (' + subCounts[i] + ')';
      });

      composerTitle.textContent = t.emotionComposer.title;
      applyCustomEmotion.textContent = t.emotionComposer.apply;
      if (actionFieldsByPart.__blink) actionFieldsByPart.__blink.nextSibling.textContent = ' ' + t.emotionComposer.blink;

      // Emotion item names + descriptions
      document.querySelectorAll('.emotion-item').forEach(function (item) {
        var e = emotions[item.dataset.emotionId];
        var desc = getEmotionDescription(e);
        item.querySelector('.emotion-item__name').textContent = getEmotionLabel(e);
        item.querySelector('.emotion-item__desc').textContent = desc;
        item.title = e.id + ' - ' + getEmotionLabel(e) + ': ' + desc;
      });
    }

    function getEmotionLabel(emotion) {
      return currentLang === 'zh' ? (emotion.desc || emotion.name || emotion.id) : (emotion.name || emotion.id);
    }

    function getEmotionDescription(emotion) {
      return currentLang === 'zh' ? (emotion.desc || emotion.name || '') : (emotion.name || emotion.desc || '');
    }

    // Cache sub-tab counts (stable across languages)
    var subCounts = groupOrder.map(function (key) {
      return Object.values(emotions).filter(function (e) { return e.group === key; }).length;
    });
    groupOrder.forEach(function (key, i) {
      subCaptions.push(subBtns[i]);
    });

    // ---- Language toggle wiring ----
    var toggleButtons = Array.prototype.slice.call(document.querySelectorAll('.lang-switch__btn'));
    toggleButtons.forEach(function (b) {
      b.addEventListener('click', function () {
        if (currentLang === b.dataset.lang) return;
        currentLang = b.dataset.lang;
        applyLanguage();
      });
    });

    // ---- Init ----
    createHero(currentCharType);
    applyLanguage();
  </script>
</body>

</html>
